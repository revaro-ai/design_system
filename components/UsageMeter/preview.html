<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UsageMeter · Revaro</title>
<link rel="icon" href="../../assets/Logos/revaro-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../site.css">
</head>
<body class="rv-root">
<div class="solo-bar"><a href="../../index.html">All components</a><button class="rv-btn" data-theme-toggle>Dark mode</button></div><main class="solo"><div class="rv-root" style="padding:16px;display:grid;gap:20px;max-width:420px"><div class="rv-meter"><div class="rv-meter__top"><span>Orders this month</span><span>312 / 600</span></div><div class="rv-meter__track"><div class="rv-meter__bar" style="width:52%"></div></div></div><div class="rv-meter rv-meter--warn"><div class="rv-meter__top"><span>AI replies</span><span>5,140 / 6,000</span></div><div class="rv-meter__track"><div class="rv-meter__bar" style="width:86%"></div></div><span class="rv-meter__note">86% used. A top-up adds 5,000 replies.</span></div><div class="rv-meter rv-meter--over"><div class="rv-meter__top"><span>AI replies</span><span>6,320 / 6,000</span></div><div class="rv-meter__track"><div class="rv-meter__bar" style="width:100%"></div></div><span class="rv-meter__note">Using your free 10% grace. Replies pause at 6,600 unless you top up.</span></div></div>
</main>
<script>
const b=document.querySelector('[data-theme-toggle]');
if(b){b.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';b.textContent=h.dataset.theme==='dark'?'Light mode':'Dark mode';});}
</script>
</body>
</html>
