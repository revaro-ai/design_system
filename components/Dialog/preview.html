<!doctype html>
<html lang="en" data-theme="light">
<head>

<body class="rv-root">
<div class="solo-bar"><a href="../../index.html">All components</a><button class="rv-btn" data-theme-toggle>Dark mode</button></div><main class="solo"><div class="rv-root"><div class="rv-scrim" style="position:relative;inset:auto;min-height:240px"><div class="rv-dialog" role="alertdialog" aria-labelledby="d1" aria-describedby="d2"><h2 class="rv-dialog__title" id="d1">Reject this payment?</h2><p class="rv-dialog__body" id="d2">Black dress M goes back into stock and the order is cancelled. You write the message to Ma Hnin yourself; Revaro won't send one.</p><div class="rv-dialog__actions"><button class="rv-btn">Keep order</button><button class="rv-btn rv-btn--danger">Reject payment</button></div></div></div></div>

<script>
const b=document.querySelector('[data-theme-toggle]');
if(b){b.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';b.textContent=h.dataset.theme==='dark'?'Light mode':'Dark mode';});}
</script>
