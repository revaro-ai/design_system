<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Select · Revaro</title>
<link rel="icon" href="../../assets/Logos/revaro-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../site.css">
</head>
<body class="rv-root">
<div class="solo-bar"><a href="../../index.html">All components</a><button class="rv-btn" data-theme-toggle>Dark mode</button></div><main class="solo"><div class="rv-root" style="padding:16px;max-width:420px;background:var(--surface)"><label class="rv-field"><span class="rv-field__label">Reply ending</span><span class="rv-select"><select><option>ရှင့် (female voice)</option><option>ခင်ဗျာ (male voice)</option></select></span><span class="rv-field__help">Used at the end of Revaro's polite replies.</span></label></div>
</main>
<script>
const b=document.querySelector('[data-theme-toggle]');
if(b){b.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';b.textContent=h.dataset.theme==='dark'?'Light mode':'Dark mode';});}
</script>
</body>
</html>
