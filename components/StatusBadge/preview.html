<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatusBadge · Revaro</title>
<link rel="icon" href="../../assets/Logos/revaro-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../site.css">
</head>
<body class="rv-root">
<div class="solo-bar"><a href="../../index.html">All components</a><button class="rv-btn" data-theme-toggle>Dark mode</button></div><main class="solo"><div class="rv-root" style="padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><span class="rv-badge rv-badge--info">Held</span><span class="rv-badge rv-badge--warning">Payment to check</span><span class="rv-badge rv-badge--warning">COD due</span><span class="rv-badge rv-badge--success">Confirmed</span><span class="rv-badge rv-badge--warning">Needs you</span><span class="rv-badge rv-badge--danger">Paid, no stock</span><span class="rv-badge rv-badge--neutral">Draft</span><span class="rv-badge rv-badge--warning rv-my" lang="my">ငွေလွှဲ စစ်ရန်</span></div>
</main>
<script>
const b=document.querySelector('[data-theme-toggle]');
if(b){b.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';b.textContent=h.dataset.theme==='dark'?'Light mode':'Dark mode';});}
</script>
</body>
</html>
