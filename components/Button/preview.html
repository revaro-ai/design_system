<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Button · Revaro</title>
<link rel="icon" href="../../assets/Logos/revaro-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../site.css">
</head>
<body class="rv-root">
<div class="solo-bar"><a href="../../index.html">All components</a><button class="rv-btn" data-theme-toggle>Dark mode</button></div><main class="solo"><div class="rv-root" style="padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center"><button class="rv-btn rv-btn--primary">Confirm order</button><button class="rv-btn">Take over chat</button><button class="rv-btn rv-btn--ghost">Mark sold elsewhere</button><button class="rv-btn rv-btn--danger">Reject payment</button><button class="rv-btn" disabled>Exporting…</button><div style="width:100%"><button class="rv-btn rv-btn--primary rv-btn--block">Confirm order · 25,000 MMK</button></div></div>
</main>
<script>
const b=document.querySelector('[data-theme-toggle]');
if(b){b.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';b.textContent=h.dataset.theme==='dark'?'Light mode':'Dark mode';});}
</script>
</body>
</html>
