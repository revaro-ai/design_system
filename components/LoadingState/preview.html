<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoadingState · Revaro</title>
<link rel="icon" href="../../assets/Logos/revaro-favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<link rel="stylesheet" href="../../site.css">
</head>
<body class="rv-root">
<div class="solo-bar"><a href="../../index.html">All components</a><button class="rv-btn" data-theme-toggle>Dark mode</button></div><main class="solo"><div class="rv-root" style="display:grid;gap:16px;padding:16px;max-width:420px;background:var(--ground)"><div style="display:flex;align-items:center;gap:12px"><span class="rv-spinner" role="status" aria-label="Loading"></span><span style="color:var(--ink-muted)">Loading orders…</span></div><div class="rv-order" aria-hidden="true"><div class="rv-skeleton" style="height:22px;width:60%"></div><div class="rv-skeleton" style="height:14px;width:40%"></div><div class="rv-skeleton" style="height:56px"></div></div></div>
</main>
<script>
const b=document.querySelector('[data-theme-toggle]');
if(b){b.addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';b.textContent=h.dataset.theme==='dark'?'Light mode':'Dark mode';});}
</script>
</body>
</html>
